[package]
name = "research-literature-library-native"
version = "0.1.0"
edition = "2024"
publish = false
description = "Canonical literature domain decisions without application or persistence owners"

[[bin]]
name = "literature-library-host"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
quick-xml = { version = "0.41", features = ["serialize"] }
regex = "1"
research-agent-api = { path = "../.dependencies/sdk/native/agent-api" }
research-workbench-native-sdk = { path = "../.dependencies/sdk/native/workbench-native-sdk" }
scraper = { version = "0.27", default-features = false }
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
